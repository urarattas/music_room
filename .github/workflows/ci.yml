# ============================================================
#  持续集成：代码检查与测试
#
#  与 docker-publish.yml 相互独立：
#  这个 workflow 失败不会阻止镜像构建，反之亦然。
# ============================================================

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支的多次推送，取消旧的运行，避免浪费资源
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      # ---------- 安装 pnpm（必须在 setup-node 之前）----------
      # setup-node 的 cache: pnpm 需要执行 `pnpm store path` 才能定位缓存目录，
      # 如果此时 pnpm 还没装好，就会报
      # "Unable to locate executable file: pnpm"。
      # pnpm/action-setup 自带缓存能力（cache: true），所以不再让 setup-node 管缓存。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: 安装 Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ---------- 单元测试（不依赖网络与浏览器） ----------
      - name: 单元测试
        run: |
          node --test --test-timeout=15000 test/websocket.test.js
          node --test test/lyrics.test.js
          node --test test/docs.test.js
          node --test test/docker.test.js
          node --test test/dockerignore.test.js
          node --test test/docker-npm.test.js
          node --test --test-timeout=20000 test/shutdown.test.js
          node --test test/workflow.test.js
          node --test test/metadata-action.test.js
          node --test test/logger.test.js

      # ---------- 容器环境模拟 ----------
      - name: 容器运行模拟
        run: node test/docker-runtime.test.js

      # ---------- 日志与房间清理 ----------
      - name: 日志端到端测试
        run: node test/logger-e2e.mjs

      - name: 房间成员清理测试
        run: node test/room-cleanup.test.js

      # ---------- 界面专项（用本地模拟上游，不依赖真实 GD 音乐台）----------
      - name: 界面专项测试（封面同步 / 歌词居中 / 音质切换）
        run: node test/ui-fixes.test.js

      - name: 滚动条样式测试
        run: node test/scrollbar.test.js

      # ---------- 集成测试 ----------
      # 其中 3 项依赖上游 GD 音乐台 API。该上游在 Cloudflare 后面，
      # 对数据中心 IP（如 GitHub runner）经常返回 403/400，
      # 这是第三方服务的可用性问题，不是我们代码的问题。
      # 那些用例会**自动跳过**（显示为 skipped 而非 failed），退出码仍为 0。
      - name: 集成测试
        run: node --test --test-timeout=30000 test/integration.test.js

      # ---------- Docker 构建校验 ----------
      # 真正执行 docker build，确保 Dockerfile 能构建成功
      - name: 验证 Docker 镜像可构建
        run: |
          docker build -t music-room:ci .
          docker run -d --name music-room-ci -p 3000:3000 music-room:ci
          sleep 5
          curl -fsS http://127.0.0.1:3000/api/health
          echo ""
          docker rm -f music-room-ci

      # ---------- 语法检查 ----------
      - name: 语法检查
        run: |
          for f in server/*.js public/js/*.js test/*.js; do
            node --check "$f" || exit 1
          done
          echo "全部文件语法正确"
